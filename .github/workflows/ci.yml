name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values so builds don't fail on missing env vars.
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      # artifacts/zola/vite.config.ts requires both at config load.
      PORT: "3000"
      BASE_PATH: "/"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      # zola-mobile's "build" starts an Expo dev server and waits for Metro
      # (a Replit-dev script, not a CI artifact); it is still type-checked.
      - name: Build
        run: pnpm -r --filter "./artifacts/**" --filter "!@workspace/zola-mobile" --if-present run build
