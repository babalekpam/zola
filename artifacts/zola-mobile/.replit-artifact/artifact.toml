kind = "mobile"
previewPath = "/zola-mobile/"
title = "Loop Mobile"
version = "1.0.0"
id = "artifacts/zola-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/zola-mobile/" ]
localPort = 26071

[services.development]
run = "pnpm --filter @workspace/zola-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zola-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zola-mobile", "run", "serve" ]

[services.env]
PORT = "26071"
BASE_PATH = "/zola-mobile/"
