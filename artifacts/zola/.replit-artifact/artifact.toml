kind = "web"
previewPath = "/"
title = "loop"
version = "1.0.0"
id = "artifacts/zola"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24879

[services.development]
run = "pnpm --filter @workspace/zola run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zola", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zola", "run", "serve" ]

[services.env]
PORT = "24879"
BASE_PATH = "/"
